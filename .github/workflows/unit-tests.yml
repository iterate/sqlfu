name: unit-tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  sqlfu:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The bun adapter tests spawn real `bun` subprocesses.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full build (including bundle-vendor) so the packed-package tests in
      # test/pkg.test.ts exercise the publish-shaped dist, not just the
      # runtime-only build that ensureBuilt() produces.
      - name: Build sqlfu
        run: pnpm --filter sqlfu build

      # resolve-sqlfu-ui tests resolve the workspace @sqlfu/ui package, whose
      # #serialized-assets import map points into its build output.
      - name: Build @sqlfu/ui
        run: pnpm --filter @sqlfu/ui build

      - name: Typecheck sqlfu
        run: pnpm --filter sqlfu typecheck

      - name: Run sqlfu tests
        run: pnpm --dir packages/sqlfu exec vitest --run

  celld:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sqlfu
        run: pnpm --filter sqlfu build

      - name: Install celld and MinIO test binaries
        env:
          CELLD_VERSION: v0.1.0
          MINIO_VERSION: RELEASE.2025-09-07T16-13-09Z
          MINIO_MC_VERSION: RELEASE.2025-08-13T08-35-41Z
        run: |
          mkdir -p "$RUNNER_TEMP/sqlfu-celld-bin"
          curl -fsSL "https://github.com/denoland/celld/releases/download/$CELLD_VERSION/celld-x86_64-unknown-linux-gnu.gz" \
            -o "$RUNNER_TEMP/sqlfu-celld-bin/celld.gz"
          gzip -d "$RUNNER_TEMP/sqlfu-celld-bin/celld.gz"
          curl -fsSL "https://github.com/minio/minio/releases/download/$MINIO_VERSION/minio.linux-amd64.$MINIO_VERSION" \
            -o "$RUNNER_TEMP/sqlfu-celld-bin/minio"
          curl -fsSL "https://github.com/minio/mc/releases/download/$MINIO_MC_VERSION/mc.linux-amd64.$MINIO_MC_VERSION" \
            -o "$RUNNER_TEMP/sqlfu-celld-bin/mc"
          chmod +x "$RUNNER_TEMP/sqlfu-celld-bin/celld" "$RUNNER_TEMP/sqlfu-celld-bin/minio" "$RUNNER_TEMP/sqlfu-celld-bin/mc"

      - name: Run real celld compatibility test
        env:
          CELLD_TEST: 1
          CELLD_BIN: ${{ runner.temp }}/sqlfu-celld-bin/celld
          MINIO_BIN: ${{ runner.temp }}/sqlfu-celld-bin/minio
          MINIO_MC_BIN: ${{ runner.temp }}/sqlfu-celld-bin/mc
        run: pnpm --dir packages/sqlfu exec vitest --run test/adapters/celld.test.ts

  pg-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same docker compose dev runs locally. Keeps the "how do I run
      # this on my laptop" answer one shell command away from "how does
      # CI run this".
      - name: Start postgres via docker compose
        run: docker compose -f packages/pg/test/docker-compose.yml up -d --wait

      - name: Run @sqlfu/pg tests
        run: pnpm --filter @sqlfu/pg exec vitest --run

      - name: Stop postgres
        if: always()
        run: docker compose -f packages/pg/test/docker-compose.yml down
