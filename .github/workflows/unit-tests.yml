name: unit-tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  sqlfu:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The bun adapter tests spawn real `bun` subprocesses.
      - uses: oven-sh/setup-bun@v2

      # The celld adapter tests spawn real `celld dev` processes.
      - name: Install celld
        env:
          CELLD_VERSION: v0.6.3
        run: |
          mkdir -p "$RUNNER_TEMP/celld-bin"
          curl -fsSL "https://github.com/denoland/celld/releases/download/$CELLD_VERSION/celld-x86_64-unknown-linux-gnu.gz" \
            | gunzip > "$RUNNER_TEMP/celld-bin/celld"
          chmod +x "$RUNNER_TEMP/celld-bin/celld"
          echo "$RUNNER_TEMP/celld-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full build (including bundle-vendor) so the packed-package tests in
      # test/pkg.test.ts exercise the publish-shaped dist, not just the
      # runtime-only build that ensureBuilt() produces.
      - name: Build sqlfu
        run: pnpm --filter sqlfu build

      # resolve-sqlfu-ui tests resolve the workspace @sqlfu/ui package, whose
      # #serialized-assets import map points into its build output.
      - name: Build @sqlfu/ui
        run: pnpm --filter @sqlfu/ui build

      - name: Typecheck sqlfu
        run: pnpm --filter sqlfu typecheck

      - name: Run sqlfu tests
        run: pnpm --dir packages/sqlfu exec vitest --run

  pg-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same docker compose dev runs locally. Keeps the "how do I run
      # this on my laptop" answer one shell command away from "how does
      # CI run this".
      - name: Start postgres via docker compose
        run: docker compose -f packages/pg/test/docker-compose.yml up -d --wait

      - name: Run @sqlfu/pg tests
        run: pnpm --filter @sqlfu/pg exec vitest --run

      - name: Stop postgres
        if: always()
        run: docker compose -f packages/pg/test/docker-compose.yml down
